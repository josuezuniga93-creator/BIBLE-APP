<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a3e"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Violet glow -->
  <ellipse cx="256" cy="256" rx="150" ry="160" fill="rgba(124,58,237,0.22)"/>
  <!-- Cross — vertical bar -->
  <rect x="223" y="103" width="66" height="282" rx="22" fill="#ffffff"/>
  <!-- Cross — horizontal bar -->
  <rect x="128" y="192" width="256" height="66" rx="22" fill="#ffffff"/>
  <!-- TULIP text -->
  <text x="256" y="456" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="48" font-weight="700"
        letter-spacing="6" fill="rgba(196,181,253,0.70)">TULIP</text>
</svg>
